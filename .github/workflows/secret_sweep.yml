name: Security - Secret Sweep

on:
  # Run manually on demand
  workflow_dispatch:
  # Run automatically on a schedule (e.g., every Sunday at midnight)
  schedule:
    - cron: '0 0 * * 0'
  # Optional: Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  sweep-secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Required if exporting to GitHub Security tab
      issues: write          # Optional: to post summary report as an issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history of the current branch only

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # Optional for enterprise features
        with:
          # Scans the git log of the checked out branch only
          args: detect --redacted --report-format=json --report-path=gitleaks-report.json --exit-code=0

      - name: Generate Markdown Job Summary
        if: always()
        run: |
          echo "## 🛡️ Secret Scan Results Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f gitleaks-report.json ]; then
            COUNT=$(jq '. | length' gitleaks-report.json)
            echo "**Total potential secrets detected:** $COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$COUNT" -gt "0" ]; then
              echo "| Rule | File | Line | Commit |" >> $GITHUB_STEP_SUMMARY
              echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
              jq -r '.[] | "| " + .RuleID + " | `" + .File + "` | " + (.StartLine|tostring) + " | " + .Commit + " |"' gitleaks-report.json >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No plaintext secrets or keys were found on this branch." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Report file was not generated." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: gitleaks-report.json
          retention-days: 30
