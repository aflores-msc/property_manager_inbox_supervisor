spring:
  application:
    name: java-mcp-code-assistant
  main:
    banner-mode: off
    web-application-type: none
  ai:
    ollama:
      base-url: ${OLLAMA_HOST:http://localhost:11434}
      chat:
        model: ${code-assistant.ollama.model}
        options:
          model: ${code-assistant.ollama.model}
          temperature: ${OLLAMA_TEMPERATURE:0.2}
    mcp:
      server:
        name: java-mcp-code-assistant
        version: ${APP_VERSION:0.1.0}
        type: SYNC
        stdio: true
        instructions: >
          Headless Java MCP server for code generation, analysis, and refactoring
          using a configurable Ollama qwen3:30b model. Tool exposure begins after
          Phase 2 review.

code-assistant:
  ollama:
    model: ${OLLAMA_MODEL:qwen3:30b}
    request-timeout: ${OLLAMA_REQUEST_TIMEOUT:2m}
    connection-timeout: ${OLLAMA_CONNECTION_TIMEOUT:15s}
